name: Build PS4 Homebrew

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wget tar make

      - name: Download OpenOrbis PS4 Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*linux*.tar.gz" -O toolchain.tar.gz || gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*.tar.gz" -O toolchain.tar.gz
          sudo mkdir -p /opt/OpenOrbis
          sudo tar -xzf toolchain.tar.gz -C /opt/OpenOrbis
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis" >> $GITHUB_ENV

      - name: Build eboot.bin
        run: |
          make

      - name: Create PKG Structure and Build PKG
        run: |
          mkdir -p pkg/sce_sys
          cp eboot.bin pkg/
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_new pkg/sce_sys/param.sfo
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo APP_VER --type Utf8 --maxsize 8 --value "01.00"
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 0
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo CATEGORY --type Utf8 --maxsize 4 --value "gd"
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value "IV0000-BREW00001_00-FPSMENUHOMEBREW0"
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value "FPS Menu"
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value "BREW00001"
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry pkg/sce_sys/param.sfo VERSION --type Utf8 --maxsize 8 --value "01.00"
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core gp4_new pkg/project.gp4
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core gp4_proj_update --volume_type pkg_ps4_app --content_id IV0000-BREW00001_00-FPSMENUHOMEBREW0 --passcode 00000000000000000000000000000000 pkg/project.gp4
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core gp4_file_add eboot.bin eboot.bin pkg/project.gp4
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core gp4_file_add sce_sys/param.sfo sce_sys/param.sfo pkg/project.gp4
          $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core pkg_build pkg/project.gp4 .

      - name: Upload PKG File
        uses: actions/upload-artifact@v4
        with:
          name: PS4-FPS-Menu-PKG
          path: "*.pkg"
