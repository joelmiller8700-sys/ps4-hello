name: Build PS4 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 llvm-12 make wget curl jq tar

      - name: Download and Setup OpenOrbis PS4 Toolchain
        run: |
          sudo mkdir -p /opt/OpenOrbis/PS4Toolchain
          sudo chmod -R 777 /opt/OpenOrbis
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/toolchain-llvm-12.tar.gz -O toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C /opt/OpenOrbis/PS4Toolchain
          rm toolchain.tar.gz

      - name: Build EBOOT and PKG
        env:
          OO_PS4_TOOLCHAIN: /opt/OpenOrbis/PS4Toolchain
        run: |
          if [ -f "Makefile" ]; then
            make
          else
            echo "Toolchain is ready! Waiting for Makefile and source code..."
          fi

      - name: Upload Final PKG Artifact
        if: hashFiles('*.pkg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PS4-FPS-Manager-PKG
          path: "*.pkg"
