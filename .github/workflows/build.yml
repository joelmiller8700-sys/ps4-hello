name: Build PS4 PKG

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wget tar make

      - name: Download Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*linux*.tar.gz" -O toolchain.tar.gz || gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*.tar.gz" -O toolchain.tar.gz
          sudo mkdir -p /opt/OpenOrbis
          sudo tar -xzf toolchain.tar.gz -C /opt/OpenOrbis
          TOOLCHAIN_DIR=$(dirname $(find /opt/OpenOrbis -name "link.x" | head -n 1))
          sudo chmod -R +x "$TOOLCHAIN_DIR/bin"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> $GITHUB_ENV

      - name: Build EBOOT
        run: |
          sed -i 's/NULL/0/g' main.cpp
          sed -i 's/OrbisUserServiceUserId/int32_t/g' main.cpp
          mkdir -p build
          clang++ --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -isysroot "$OO_PS4_TOOLCHAIN" -isystem "$OO_PS4_TOOLCHAIN/include" -isystem "$OO_PS4_TOOLCHAIN/include/c++/v1" -O2 -c main.cpp -o build/main.o
          ld.lld -m elf_x86_64 -pie --script "$OO_PS4_TOOLCHAIN/link.x" --eh-frame-hdr -o build/homebrew.elf "$OO_PS4_TOOLCHAIN/lib/crtlib.o" build/main.o -L"$OO_PS4_TOOLCHAIN/lib" -lc -lkernel -lc++ -lScePad -lSceUserService
          "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" -in=build/homebrew.elf --out=build/homebrew.oelf --eboot=eboot.bin --paid 0x3800000000000011

      - name: Build PKG
        run: |
          mkdir -p pkg/sce_sys
          cp eboot.bin pkg/
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_new pkg/sce_sys/param.sfo
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo APP_VER --type Utf8 --maxsize 8 --value "01.00"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 0
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo CATEGORY --type Utf8 --maxsize 4 --value "gd"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value "IV0000-BREW00001_00-FPSMENU000000000"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value "FPS Menu"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value "BREW00001"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" sfo_setentry pkg/sce_sys/param.sfo VERSION --type Utf8 --maxsize 8 --value "01.00"
          cd pkg && "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4" -out project.gp4 --content-id=IV0000-BREW00001_00-FPSMENU000000000 --files="eboot.bin sce_sys/param.sfo"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_build project.gp4 ..

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Menu-PKG
          path: "*.pkg"
